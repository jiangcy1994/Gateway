[package]
name = "top-gateway"
version = "0.2.0"
edition = "2021"
description = "Top-level gateway: mounts sub-gateways under path prefixes, forwards traffic, and exposes an admin REST API for routing, health, and metrics"
license = "MIT"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
rand = "0.8"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Windows service shell (src/service.rs); a no-op on other targets.
[target.'cfg(windows)'.dependencies]
tracing-appender = "0.2"
windows-service = "0.7"

[profile.release]
lto = "thin"
