# top-gateway LLM 应用（模型组合）示例配置（ADR-L15/L18）。
#
# 入站凭证即应用身份：客户端把 key 填在 SDK 原本填供应商 key 的位置
# （`Authorization: Bearer <key>` 或 `x-api-key: <key>`），网关据此识别来源
# app 并限制其可用模型集合；随后客户端凭证一律被替换成选中供应商的凭证。
#
# 示例 key 全是占位符；正式 key 用管理 API 生成（POST /__admin/llm/apps
# 省略 key 即自动生成 `sk-gw-<uuid v4 simple>` 形态）。key 明文落盘，与
# providers.toml 的 api_key 同级处理（ADR-L11/L18）。
#
# 凭证矩阵：
#   无凭证                → 默认策略放行（全部已映射模型）
#   有凭证但不命中任何 app → 401（fail-closed：瞎写的 key 换不来权限）
#   命中但 enabled = false → 403
#   命中但请求 model 不在组合内 → 403（仅覆盖 body 里带 model 的请求：
#                          无 model / 非 JSON 的请求不拦截——R11 盲区；
#                          超出 16 MiB 的请求直接 413 拒绝，不进入盲区）
#
# 字段的权威定义见 src/llm/app.rs 与 docs/sdd/llm/data-model.md。

# Claude Code CLI：只用共享上游的两个模型
[[apps]]
id = "cli-code"                            # 表内唯一；省略时生成 UUID v4；显式空串/纯空白 = 400
name = "Claude Code CLI"                   # 展示名，缺省空串
key = "sk-gw-00000000-0000-0000-0000-000000000000"   # 表内唯一；占位演示
models = ["chat-pro", "chat-max"]          # 网关侧模型名（providers 声明的 name）
enabled = true                             # 缺省 true；false 时该 key 得 403

# Cherry Studio：混用共享上游模型与托管开放模型
[[apps]]
id = "cherry-studio"
name = "Cherry Studio"
key = "sk-gw-00000000-0000-0000-0000-000000000001"
models = ["chat-pro", "reason-large", "coder-32b"]
enabled = true

# 空模型表 = 不限制：放行全部已映射模型（范围与「无凭证」相同，只是带身份）。
# 适合内部工具；对外建议按需收紧组合。
[[apps]]
id = "open-all"
name = "不限制组合"
key = "sk-gw-00000000-0000-0000-0000-000000000002"
models = []                                # 空表 = 不限制；与缺省（省略字段）等价
enabled = true

# 临时停用示例：enabled = false 时该 key 得 403（配合 PUT 触发，不需删条目）
